[project]
name = "template"
version = "0.1.0"
description = "Minimal Python template"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
        "hypothesis>=6.168.3",
        "mutmut>=3.8.0",
        "pytest>=9.1.1",
        "pytest-cov>=7.1.0",
        "ruff>=0.16.9",
        "ty>=0.0.84",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100
fix = true
unsafe-fixes = true
show-fixes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C901"]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--cov", "--cov-report=term-missing", "--cov-report=xml"]

[tool.coverage.run]
source = ["template"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
fail_under = 80

[tool.mutmut]
source_paths = ["src/template"]
pytest_add_cli_args = ["--no-cov"]
mutate_only_covered_lines = true
