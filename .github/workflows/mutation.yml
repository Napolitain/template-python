name: Mutation

on:
    workflow_dispatch:
    schedule:
        - cron: "0 4 * * 1"

jobs:
    mutmut:
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: astral-sh/setup-uv@v10.2.0

            - run: uv sync --locked

            - uses: j178/prek-action@v3.0.0
              with:
                  extra-args: --all-files --hook-stage manual mutmut
