name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: astral-sh/setup-uv@v10.2.0

            - run: uv sync --locked

            - uses: j178/prek-action@v3.0.0

            - run: uv run pytest
