name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: astral-sh/setup-uv@v10.2.0

            - run: uv sync --locked

            - name: Hooks (pre-commit)
              uses: j178/prek-action@v3.0.0

            # Includes pytest with the coverage gate.
            - name: Hooks (pre-push)
              run: prek run --show-diff-on-failure --all-files --hook-stage pre-push
